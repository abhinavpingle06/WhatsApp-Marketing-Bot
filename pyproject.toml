[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsapp-marketing-bot"
version = "0.1.0"
description = "A FastAPI webhook and WhatsApp Cloud API test client."
readme = { text = "WhatsApp Marketing Bot: FastAPI webhook and WhatsApp Cloud API test scripts.", content-type = "text/plain" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "requests>=2.32,<3.0",
    "urllib3>=2.2,<3.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<1.0",
]

[tool.setuptools.packages.find]
include = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
